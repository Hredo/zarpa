name: Proponer una idea
description: Algo nuevo que haría Zarpa más útil
labels: [idea]
body:
  - type: textarea
    id: problema
    attributes:
      label: Qué problema resuelve
      description: Qué quieres hacer con la app y hoy no puedes (o te cuesta).
    validations: { required: true }
  - type: textarea
    id: propuesta
    attributes:
      label: Cómo te lo imaginas
  - type: textarea
    id: alternativas
    attributes:
      label: Alternativas que has pensado
